########################################################
# demo_tts 双工语音 Demo（Node：静态页 + SSE 下行 + REST 上行）
# 放到 /etc/nginx/snippets/demo-tts.conf，
# 然后在 www.bigorange.site 的 443 server 块里 include 进来：
#   include /etc/nginx/snippets/demo-tts.conf;
#   （和现有的 include /etc/nginx/snippets/path-seeker.conf; 并列）
########################################################

location = /demo_tts {
    return 301 /demo_tts/;
}

location /demo_tts/ {

    # 演示页没有登录态，谁打开都能消耗你的接口额度，上公网至少开一层
    # auth_basic "path-seeker";
    # auth_basic_user_file /etc/nginx/.htpasswd;
    # allow 10.0.0.0/8;
    # deny all;

    # 与 ecosystem.config.cjs 的 DEMO_BASE_PATH 保持一致：
    # 末尾不要 /，Node 收到的就是原始 /demo_tts/... 再由 basePath 剥掉前缀
    proxy_pass http://127.0.0.1:5178;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 必须关缓冲：否则事件被 Nginx 攒着，表现为"点了没反应，过一会儿一起出声"
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 一轮对话要等 ASR + LLM + 多句 TTS；SSE 靠 15s 心跳保活
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 上行是 base64 的整段 WAV（20s@16k 单声道约 900KB），默认 1m 会被 413
    client_max_body_size 12m;

    # 可选：给上行接口单独限流，先在 http{} 里加
    # limit_req_zone $binary_remote_addr zone=demo_tts_turn:10m rate=30r/m;
    # limit_req zone=demo_tts_turn burst=5 nodelay;
}
