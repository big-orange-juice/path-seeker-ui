########################################################
# Path Seeker Admin
########################################################
location /path-seeker/admin/ {

    client_max_body_size 100m;

    proxy_pass http://127.0.0.1:5000/path-seeker/admin/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

########################################################
# Path Seeker Client (Vue3 + Vite)
########################################################
location = /path-seeker/client {
    return 301 /path-seeker/client/;
}
location /path-seeker/client/ {

    alias /home/xsf/products/path-seeker-h5/;

    try_files $uri $uri/ @client;
}

location @client {
    # 命名 location 里不要再用 alias 的 $uri 陷阱
    # 直接把 SPA 入口指回去
    rewrite ^ /path-seeker/client/index.html last;
}

########################################################
# Static Assets
########################################################
location /path-seeker/client/assets/ {

    alias /home/xsf/products/path-seeker-h5/assets/;

    try_files $uri =404;

    expires 30d;
    add_header Cache-Control "public, immutable";
}

########################################################
# MiniMax TTS Proxy
########################################################
location /path-seeker/client/minimax-tts/ {

    proxy_pass https://api.minimaxi.com/;

    proxy_ssl_server_name on;

    proxy_http_version 1.1;

    proxy_set_header Host api.minimaxi.com;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;

    proxy_buffering off;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    client_max_body_size 2m;
}

########################################################
# Path Seeker API (.NET)
########################################################
location /path-seeker/api/ {

    # /path-seeker/api/xxx  ->  /api/xxx
    rewrite ^/path-seeker/api/(.*)$ /api/$1 break;

    proxy_pass http://127.0.0.1:8199;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    client_max_body_size 20m;
}

########################################################
# Swagger
########################################################
location /path-seeker/swagger/ {

    proxy_pass http://127.0.0.1:8199/swagger/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
