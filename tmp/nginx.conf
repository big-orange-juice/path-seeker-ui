user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;
    # 在这里添加你的 server 块
    server {
        listen 80;
        listen [::]:80;          # 同时支持 IPv6
        server_name www.omahaaigc.com omahaaigc.com;

        root /var/www/html;      # 改成你网站的实际根目录
        index index.html index.htm index.php;

        location / {
            try_files $uri $uri/ =404;
        }

        # 如果你需要 PHP 支持，可以取消下面注释并调整
        # location ~ \.php$ {
        #     include snippets/fastcgi-php.conf;
        #     fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        # }
    }

    server {
		# 监听443端口，启用SSL和HTTP/2协议以提升性能
		listen 443 ssl http2;
		listen [::]:443 ssl http2;
		server_name www.omahaaigc.com omahaaigc.com;

		# SSL证书配置
		ssl_certificate /etc/nginx/ssl/omahaaigc.com.pem;      # 证书文件完整路径
		ssl_certificate_key /etc/nginx/ssl/omahaaigc.com.key;  # 私钥文件完整路径

		# 网站根目录等配置
		root /var/www/html;
		index index.html index.htm;

		location / {
			try_files $uri $uri/ =404;
		}
		include /etc/nginx/snippets/path-seeker.conf;
		include /etc/nginx/snippets/chunmi_demo_m.conf;
		include /etc/nginx/snippets/chunmi-scm.conf;
		include /etc/nginx/snippets/pathseeker-app.conf;
    }

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


