plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingFile = rootProject.file('.signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def localSettings = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localSettings.load(it) }

android {
    namespace 'com.pathseeker.driver'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pathseeker.driver'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'AMAP_KEY', groovy.json.JsonOutput.toJson(localSettings.getProperty('amap.key', ''))
        manifestPlaceholders = [AMAP_KEY: localSettings.getProperty('amap.key', '')]
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/driver-debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/driver-release.jks')
                storePassword signingProperties.getProperty('storePassword')
                keyAlias 'driver-release'
                keyPassword signingProperties.getProperty('storePassword')
            }
        }
    }
    buildTypes {
        release { if (signingFile.exists()) signingConfig signingConfigs.release }
    }
}

dependencies {
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.101_sea9.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
