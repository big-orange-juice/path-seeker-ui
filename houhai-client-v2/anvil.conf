     location ^~ /rocket-ledger {
         proxy_pass http://127.0.0.1:21728;   # 末尾不要 /
         proxy_http_version 1.1;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_buffering off;
         client_max_body_size 20m;
         proxy_read_timeout 120s;
     }

location = /dt_demo {
    return 301 /dt_demo/;
}

location /dt_demo/ {

    alias /usr/zhm/dt_demo/dist/;

    index index.html;

    # 无前端路由，静态文件未命中直接 404
    try_files $uri $uri/ =404;
}

# Vite 构建产物为内容哈希文件名，可长期缓存
location /dt_demo/assets/ {

    alias /usr/zhm/dt_demo/dist/assets/;

    try_files $uri =404;

    expires 30d;
    add_header Cache-Control "public, immutable";
}